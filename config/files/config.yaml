Server:
  Port: 8903
  ReadTimeout: 15s
  WriteTimeout: 15s

API:
  BasePath: ""
  APITimeout: 15s
  EnableSwagger: true

Database:
  SlaveDSN: "clickhouse://default:changeme@clickhouse:9000/default"
  MasterDSN: "clickhouse://default:changeme@clickhouse:9000/default"
  RetryInterval: 10
  MaxIdleConn: 10
  MaxConn: 10
  ConnMaxLifetime: 10s

Kafka:
  Consumer:
    Brokers: ["kafka:9092"]
    ClusterVersion: "3.2.0"
    ConsumerGroup: "result-service"
    MaxRetries: 3
    WorkerPoolSize: 5
    Retry:
      HandlerTimeout: 20s
      MaxRetry: 3
      RetryInitialDelay: 100ms
      MaxJitter: 500ms
      BackOffConfig:
        - 1m
        - 5m
        - 10m
  Topics:
    VoteSubmitData:
      Value: "votes.submit"
      ErrorHandler: "Phase1"
      WithBackOff: true
    VoteProcessed:
      Value: "votes.processed"
      ErrorHandler: "Phase1"
      WithBackOff: false
    VoteDLQ:
      Value: "votes.dlq"
      ErrorHandler: "Phase1"
      WithBackOff: false

GrpcServer:
  Port: 35001

RedisConfig:
  Connection: "redis://:@redis2:6379"

